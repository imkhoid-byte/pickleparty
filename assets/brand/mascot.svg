<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- PickleParty mascot: an original cartoon pickle holding a paddle. -->
  <defs>
    <linearGradient id="pickle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BE04A"/>
      <stop offset="1" stop-color="#4F9A1E"/>
    </linearGradient>
    <linearGradient id="paddle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6FA9"/>
      <stop offset="1" stop-color="#E02776"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFF27A"/>
      <stop offset="1" stop-color="#F2C014"/>
    </radialGradient>
  </defs>
  <g transform="translate(51 51) scale(0.9)">

  <!-- Ball -->
  <g transform="translate(250 235)">
    <circle r="78" fill="url(#ball)" stroke="#B88A00" stroke-width="10"/>
    <circle cx="-28" cy="-22" r="11" fill="#C99A00"/>
    <circle cx="22" cy="-30" r="11" fill="#C99A00"/>
    <circle cx="-6" cy="12" r="11" fill="#C99A00"/>
    <circle cx="36" cy="18" r="11" fill="#C99A00"/>
    <circle cx="-40" cy="30" r="9" fill="#C99A00"/>
    <path d="M -110 -40 Q -140 -60 -165 -55" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M -105 0 Q -140 -5 -170 10" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Pickle body -->
  <g transform="translate(440 600) rotate(-14)">
    <rect x="-200" y="-330" width="400" height="660" rx="200" fill="url(#pickle)" stroke="#2C6510" stroke-width="18"/>
    <!-- bumps -->
    <g fill="#3E8217">
      <ellipse cx="-120" cy="-150" rx="18" ry="24"/>
      <ellipse cx="130" cy="-60" rx="16" ry="22"/>
      <ellipse cx="-140" cy="120" rx="18" ry="24"/>
      <ellipse cx="110" cy="190" rx="16" ry="22"/>
      <ellipse cx="-40" cy="250" rx="16" ry="22"/>
      <ellipse cx="60" cy="-240" rx="14" ry="20"/>
    </g>
    <!-- shine -->
    <rect x="-150" y="-270" width="60" height="280" rx="30" fill="#FFFFFF" fill-opacity="0.28"/>
    <!-- face -->
    <g transform="translate(0 -70)">
      <ellipse cx="-78" cy="0" rx="50" ry="58" fill="#FFFFFF" stroke="#1B3F08" stroke-width="8"/>
      <ellipse cx="78" cy="0" rx="50" ry="58" fill="#FFFFFF" stroke="#1B3F08" stroke-width="8"/>
      <circle cx="-66" cy="10" r="27" fill="#160A2B"/>
      <circle cx="90" cy="10" r="27" fill="#160A2B"/>
      <circle cx="-56" cy="0" r="10" fill="#FFFFFF"/>
      <circle cx="100" cy="0" r="10" fill="#FFFFFF"/>
      <ellipse cx="-125" cy="85" rx="34" ry="20" fill="#FF6FA9" fill-opacity="0.75"/>
      <ellipse cx="125" cy="85" rx="34" ry="20" fill="#FF6FA9" fill-opacity="0.75"/>
      <path d="M -70 80 Q 0 170 70 80 Z" fill="#7A1035" stroke="#1B3F08" stroke-width="10" stroke-linejoin="round"/>
      <path d="M -36 118 Q 0 150 36 118 Q 0 104 -36 118 Z" fill="#FF6FA9"/>
    </g>
  </g>

  <!-- Paddle, gripped by the hand -->
  <g transform="translate(826 438) rotate(28) scale(0.8)">
    <rect x="-38" y="150" width="76" height="230" rx="30" fill="#3B2A55" stroke="#1E1230" stroke-width="12"/>
    <path d="M -38 200 L 38 220 M -38 250 L 38 270 M -38 300 L 38 320" stroke="#5B4680" stroke-width="10"/>
    <rect x="-150" y="-200" width="300" height="380" rx="140" fill="url(#paddle)" stroke="#9E0F4D" stroke-width="16"/>
    <rect x="-112" y="-160" width="224" height="300" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="14"/>
  </g>

  <!-- Arm reaching to the paddle handle, with a little hand -->
  <path d="M 600 640 Q 680 660 730 612" stroke="#2C6510" stroke-width="58" stroke-linecap="round" fill="none"/>
  <path d="M 600 640 Q 680 660 730 612" stroke="#7CC93A" stroke-width="34" stroke-linecap="round" fill="none"/>
  <circle cx="740" cy="600" r="44" fill="#7CC93A" stroke="#2C6510" stroke-width="12"/>

  <!-- Other arm, waving -->
  <path d="M 290 600 Q 200 560 190 470" stroke="#2C6510" stroke-width="58" stroke-linecap="round" fill="none"/>
  <path d="M 290 600 Q 200 560 190 470" stroke="#7CC93A" stroke-width="34" stroke-linecap="round" fill="none"/>
  <circle cx="188" cy="458" r="40" fill="#7CC93A" stroke="#2C6510" stroke-width="12"/>
  </g>
</svg>
