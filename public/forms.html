<!doctype html>
<!-- Netlify finds forms by scanning deployed HTML. The app posts to this form
     with JavaScript; this hidden copy just registers it. Do not delete. -->
<html><head><meta charset="utf-8"><title>Forms</title></head>
<body>
  <form name="pro-waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input type="email" name="email">
    <input name="interest">
    <input name="platform">
  </form>
</body></html>
